<!DOCTYPE html>
<html lang="en" data-theme="dark" data-style="ocean">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitPulse – Workouts, Calories & Run Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="CSSworkout.css">
</head>
<body>
<header>
  <h1>💪 FitPulse</h1>
  <nav><a href="#calc">Calculator</a><a href="#workouts">Workouts</a><a href="#map-sec">Map</a></nav>
  <div class="ctrl">
    <select id="styleSel" aria-label="Style">
      <option value="ocean">🌊 Ocean</option><option value="sunset">🌅 Sunset</option>
      <option value="forest">🌲 Forest</option><option value="neon">⚡ Neon</option>
    </select>
    <button id="themeBtn" aria-label="Toggle dark/light">🌙</button>
  </div>
</header>

<main>
<section id="calc" class="card">
  <h2>Calorie &amp; BMI Calculator</h2>
  <form id="calcForm">
    <label>Age<input id="age" type="number" min="10" max="100" value="25" required></label>
    <label>Sex<select id="sex"><option value="m">Male</option><option value="f">Female</option></select></label>
    <label>Height (cm)<input id="height" type="number" min="100" max="250" value="170" required></label>
    <label>Weight (kg)<input id="weight" type="number" min="30" max="300" value="70" required></label>
    <label>Activity<select id="activity">
      <option value="1.2">Sedentary</option><option value="1.375">Light (1–3 days/wk)</option>
      <option value="1.55" selected>Moderate (3–5 days/wk)</option><option value="1.725">Very active (6–7 days)</option>
      <option value="1.9">Athlete</option></select></label>
    <label>Goal<select id="goal">
      <option value="-500">Lose weight (−500)</option><option value="0" selected>Maintain</option>
      <option value="300">Gain muscle (+300)</option></select></label>
    <button class="btn" type="submit">Calculate</button>
  </form>
  <div id="results" hidden></div>
</section>

<section id="workouts" class="card">
  <h2>Workout Routines <small id="count"></small></h2>
  <div class="filters">
    <select id="catSel"><option value="all">All BMI groups</option><option value="under">Underweight</option>
      <option value="normal">Normal</option><option value="over">Overweight</option><option value="obese">Obese</option></select>
    <select id="typeSel"><option value="all">All types</option></select>
    <input id="search" placeholder="Search routines or exercises…">
  </div>
  <div id="routines"></div>
</section>

<section id="map-sec" class="card">
  <h2>Run / Jog / Walk Map</h2>
  <div class="filters">
    <select id="mode"><option value="3.5">🚶 Walking</option><option value="7">🏃 Jogging</option><option value="9.8">💨 Running</option></select>
    <button class="btn" id="startBtn">▶ Start</button>
    <button class="btn alt" id="stopBtn" disabled>⏸ Pause</button>
    <button class="btn alt" id="resetBtn">⟲ Reset</button>
    <button class="btn alt" id="planBtn">📍 Plan route: OFF</button>
  </div>
  <div id="map"></div>
  <div class="stats">
    <div><b id="sDist">0.00</b><span>km</span></div><div><b id="sTime">00:00</b><span>time</span></div>
    <div><b id="sPace">--</b><span>min/km</span></div><div><b id="sCal">0</b><span>kcal</span></div>
  </div>
  <p class="hint" id="mapMsg">Press Start to track with GPS, or turn on Plan route and click the map to measure a route.</p>
</section>
</main>
<footer>Made with ❤️ — consult a doctor before starting any new exercise program.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="JSworkout.js"></script>
</body>
</html>
